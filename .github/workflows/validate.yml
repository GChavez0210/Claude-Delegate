name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate package
        run: python scripts/validate_skill.py --require-deps
